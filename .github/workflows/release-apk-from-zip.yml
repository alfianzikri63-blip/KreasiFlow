name: Publish Signed KreasiFlow APK from ZIP
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi stabil MAJOR.MINOR.PATCH, contoh 5.0.0 atau 5.0.1'
        required: true
        default: '5.0.0'
        type: string
permissions:
  contents: write
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source ZIP into workspace
        shell: bash
        run: |
          set -euo pipefail
          test -s KreasiFlow-Android-Update-V5-Source.zip
          unzip -q KreasiFlow-Android-Update-V5-Source.zip -d extracted
          SRC=extracted/KreasiFlow-Studio-Android-Updater-V5
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"
          cp -a "$SRC/app" "$SRC/gradle" .
          cp "$SRC/build.gradle" "$SRC/settings.gradle" "$SRC/gradle.properties" .
      - name: Validate release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Format harus MAJOR.MINOR.PATCH, contoh 5.0.1' >&2; exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if (( 10#$minor > 999 || 10#$patch > 999 || 10#$major > 2000 )); then
            echo 'Batas: MAJOR <= 2000 dan MINOR/PATCH <= 999' >&2; exit 1
          fi
          code=$(( 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch ))
          if (( code < 5000000 || code > 2100000000 )); then
            echo 'versionCode harus lebih besar/sama dari versi pertama dan di bawah batas Android' >&2; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION sudah ada. Naikkan nomor versi." >&2; exit 1
          fi
          echo "KREASIFLOW_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "KREASIFLOW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "KREASIFLOW_GITHUB_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - name: Restore keystore private from GitHub secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.KREASIFLOW_KEYSTORE_B64 }}
          KREASIFLOW_STORE_PASSWORD: ${{ secrets.KREASIFLOW_STORE_PASS }}
          KREASIFLOW_KEY_ALIAS: ${{ secrets.KREASIFLOW_KEY_ALIAS }}
          KREASIFLOW_KEY_PASSWORD: ${{ secrets.KREASIFLOW_KEY_PASS }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_B64" || -z "$KREASIFLOW_STORE_PASSWORD" || -z "$KREASIFLOW_KEY_ALIAS" || -z "$KREASIFLOW_KEY_PASSWORD" ]]; then
            echo 'Empat GitHub Actions secrets signing belum lengkap. Lihat README.' >&2; exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kreasiflow-release.jks"
          chmod 600 "$RUNNER_TEMP/kreasiflow-release.jks"
          echo "KREASIFLOW_KEYSTORE_PATH=$RUNNER_TEMP/kreasiflow-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KREASIFLOW_STORE_PASSWORD: ${{ secrets.KREASIFLOW_STORE_PASS }}
          KREASIFLOW_KEY_ALIAS: ${{ secrets.KREASIFLOW_KEY_ALIAS }}
          KREASIFLOW_KEY_PASSWORD: ${{ secrets.KREASIFLOW_KEY_PASS }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify signing and prepare asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" dist/KreasiFlow-Studio.apk
          (cd dist && sha256sum KreasiFlow-Studio.apk > SHA256SUMS.txt)
      - name: Upload APK artifact for backup
        uses: actions/upload-artifact@v4
        with:
          name: KreasiFlow-v${{ inputs.version }}-signed
          path: |
            dist/KreasiFlow-Studio.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release + APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${KREASIFLOW_VERSION_NAME}" \
            dist/KreasiFlow-Studio.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KreasiFlow Studio v${KREASIFLOW_VERSION_NAME}" \
            --generate-notes --latest
